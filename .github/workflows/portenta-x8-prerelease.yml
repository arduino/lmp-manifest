name: Upload Portenta X8 image pre-release

on:
  push:
  schedule:
    # Runs every day at 8 AM
    - cron: '0 8 * * *'

jobs:
  GetVersions:
    uses: ./.github/workflows/foundries-target.yml
    with:
      factory: arduino
      branch: main
    secrets: inherit

  UploadPreRelease:
    needs: [GetVersions]
    uses: ./.github/workflows/foundries-prerelease.yml
    if: ${{ needs.GetVersions.outputs.factory-version != needs.GetVersions.outputs.bucket-version }}
    with:
      factory: arduino
      branch: main
      target-version: ${{ needs.GetVersions.outputs.factory-version }}
      artifacts: "portenta-x8-mfgtools/mfgtool-files-portenta-x8.tar.gz,portenta-x8/imx-boot-portenta-x8,portenta-x8/u-boot-portenta-x8.itb,portenta-x8/sit-portenta-x8.bin,assemble-system-image/main/lmp-factory-image-portenta-x8.wic.gz"
      slack-message: Portenta X8 target version ${{ needs.GetVersions.outputs.factory-version }} is available for testing
    secrets: inherit
